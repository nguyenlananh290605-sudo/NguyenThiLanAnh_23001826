<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý công việc cá nhân</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 520px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-group input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 9px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-add {
            background: #007bff;
            color: white;
        }

        .filters {
            display: flex;
            gap: 5px;
            margin: 20px 0;
        }

        .filters button {
            flex: 1;
            background: #e9ecef;
            font-size: 12px;
        }

        .filters .active {
            background: #007bff;
            color: white;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        .task-content {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: #999;
        }

        .task-time {
            display: block;
            color: #888;
            font-size: 11px;
            margin-top: 4px;
        }

        .task-id {
            color: #666;
            font-size: 12px;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
            font-size: 13px;
        }

        .btn-clear {
            background: #ff9800;
            color: white;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div id="app" class="container">
        <h2>QUẢN LÝ CÔNG VIỆC</h2>

        <!-- Thêm công việc -->
        <div class="input-group">
            <input type="text" v-model.trim="tenMoi" @keyup.enter="themCongViec" placeholder="Nhập công việc...">

            <button class="btn-add" @click="themCongViec">
                Thêm
            </button>
        </div>

        <small>
            Có thể nhập nhiều công việc cách nhau bằng dấu phẩy.
        </small>

        <!-- Bộ lọc -->
        <div class="filters">
            <button :class="{ active: boLoc === 'all' }" @click="boLoc = 'all'">
                Tất cả
            </button>

            <button :class="{ active: boLoc === 'active' }" @click="boLoc = 'active'">
                Chưa hoàn thành
            </button>

            <button :class="{ active: boLoc === 'done' }" @click="boLoc = 'done'">
                Đã hoàn thành
            </button>
        </div>

        <!-- Danh sách công việc -->
        <ul v-if="congViecLoc.length > 0">
            <li v-for="cv in congViecLoc" :key="cv.id">

                <span class="task-id">
                    #{{ cv.id }}
                </span>

                <input type="checkbox" v-model="cv.hoanThanh">

                <div class="task-content">
                    <span :class="{ completed: cv.hoanThanh }">
                        {{ cv.ten }}
                    </span>

                    <small class="task-time">
                        {{ cv.thoiGian }}
                    </small>
                </div>

                <button class="btn-delete" @click="xoaCongViec(cv.id)">
                    Xóa
                </button>
            </li>
        </ul>

        <!-- Thông báo danh sách rỗng -->
        <p v-else class="empty">
            {{ thongBaoRong }}
        </p>

        <!-- Thống kê -->
        <div class="footer">
            <span>
                Tổng: {{ tongCongViec }}
                | Chưa xong: {{ chuaHoanThanh }}
            </span>

            <button class="btn-clear" @click="xoaDaHoanThanh" :disabled="tongCongViec === chuaHoanThanh">
                Xóa việc đã hoàn thành
            </button>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    tenMoi: "",
                    boLoc: "all",
                    nextId: 4,

                    congViec: [
                        {
                            id: 1,
                            ten: "Làm bài tập Vue.js",
                            hoanThanh: true,
                            thoiGian: "08:00"
                        },
                        {
                            id: 2,
                            ten: "Ôn tập JavaScript",
                            hoanThanh: false,
                            thoiGian: "09:00"
                        },
                        {
                            id: 3,
                            ten: "Đọc tài liệu",
                            hoanThanh: false,
                            thoiGian: "10:00"
                        }
                    ]
                };
            },

            computed: {
                tongCongViec() {
                    return this.congViec.length;
                },

                chuaHoanThanh() {
                    return this.congViec.filter(
                        cv => !cv.hoanThanh
                    ).length;
                },

                congViecLoc() {
                    if (this.boLoc === "active") {
                        return this.congViec.filter(
                            cv => !cv.hoanThanh
                        );
                    }

                    if (this.boLoc === "done") {
                        return this.congViec.filter(
                            cv => cv.hoanThanh
                        );
                    }

                    return this.congViec;
                },

                thongBaoRong() {
                    if (this.congViec.length === 0) {
                        return "Danh sách công việc trống!";
                    }

                    if (this.boLoc === "active") {
                        return "Không còn công việc chưa hoàn thành.";
                    }

                    if (this.boLoc === "done") {
                        return "Chưa có công việc nào hoàn thành.";
                    }

                    return "Không có công việc.";
                }
            },

            methods: {
                themCongViec() {
                    if (!this.tenMoi.trim()) return;

                    const danhSach = this.tenMoi.split(",");

                    danhSach.forEach(ten => {
                        ten = ten.trim();

                        if (ten !== "") {
                            this.congViec.push({
                                id: this.nextId++,
                                ten: ten,
                                hoanThanh: false,
                                thoiGian: new Date()
                                    .toLocaleString("vi-VN")
                            });
                        }
                    });

                    this.tenMoi = "";
                },

                xoaCongViec(id) {
                    this.congViec = this.congViec.filter(
                        cv => cv.id !== id
                    );
                },

                xoaDaHoanThanh() {
                    this.congViec = this.congViec.filter(
                        cv => !cv.hoanThanh
                    );
                }
            }
        }).mount("#app");
    </script>
</body>

</html>
