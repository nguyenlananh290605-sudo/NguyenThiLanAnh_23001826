<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin sinh viên</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        .card {
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
            text-align: center;
        }

        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }

        .gioi {
            color: green;
        }

        .kha {
            color: blue;
        }

        .trungbinh {
            color: orange;
        }

        .chuadat {
            color: red;
        }

        button {
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="card">
            <h2>THÔNG TIN SINH VIÊN</h2>

            <img v-bind:src="sinhVien.anh" v-bind:alt="sinhVien.hoTen">

            <h3>{{ sinhVien.hoTen }}</h3>

            <p>Mã sinh viên: {{ sinhVien.maSV }}</p>

            <p>Lớp: <span v-text="sinhVien.lop"></span></p>

            <p>Điểm trung bình: {{ sinhVien.diemTB }}</p>

            <p>
                Xếp loại:
                <strong :class="xepLoaiClass">
                    {{ xepLoai }}
                </strong>
            </p>

            <p v-if="sinhVien.dangHoc">
                Trạng thái: Đang học
            </p>
            <p v-else>
                Trạng thái: Đã nghỉ
            </p>

            <button @click="hienGioiThieu = !hienGioiThieu">
                Bật / Tắt giới thiệu
            </button>

            <p v-show="hienGioiThieu">
                {{ sinhVien.gioiThieu }}
            </p>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    sinhVien: {
                        maSV: "23001234",
                        hoTen: "Nguyễn Thị Lan Anh",
                        lop: "K68A1",
                        anh: "https://i.pravatar.cc/150?img=12",
                        diemTB: 8.5,
                        dangHoc: true,
                        gioiThieu: "Tôi là sinh viên yêu thích lập trình."
                    },
                    hienGioiThieu: false
                };
            },

            computed: {
                xepLoai() {
                    const diem = this.sinhVien.diemTB;

                    if (diem >= 8) return "Giỏi";
                    if (diem >= 6.5) return "Khá";
                    if (diem >= 5) return "Trung bình";
                    return "Chưa đạt";
                },

                xepLoaiClass() {
                    const diem = this.sinhVien.diemTB;

                    if (diem >= 8) return "gioi";
                    if (diem >= 6.5) return "kha";
                    if (diem >= 5) return "trungbinh";
                    return "chuadat";
                }
            }
        }).mount("#app");
    </script>
</body>

</html>
