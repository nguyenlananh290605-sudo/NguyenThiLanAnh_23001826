<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2 - Danh mục sản phẩm bằng component</title>
    <style>
        * { box-sizing: border-box; }
        [v-cloak] { display: none; }
        body { margin: 0; padding: 30px 16px; font-family: Arial, sans-serif; background: #f0f2f5; color: #243247; }
        .container { max-width: 1100px; margin: auto; }
        header { margin-bottom: 24px; }
        h1 { font-size: 26px; margin: 0 0 12px; }
        header p { line-height: 1.6; color: #526174; }
        .product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; align-items: start; }
        .product-card { overflow: hidden; background: white; border-radius: 12px; box-shadow: 0 3px 12px #0000000d; }
        .product-image, .image-placeholder { display: block; width: 100%; height: 180px; object-fit: cover; background: #e8edf4; }
        .image-placeholder { display: grid; place-items: center; color: #526174; }
        .product-body { padding: 18px; }
        h2 { font-size: 19px; margin: 16px 0 12px; }
        .price { color: #1765cc; font-size: 21px; font-weight: bold; }
        .stock { color: #526174; font-size: 14px; }
        .badge { display: inline-block; padding: 5px 9px; border-radius: 20px; font-size: 13px; }
        .in-stock { color: #14643a; background: #e1f5e9; }
        .out-stock { color: #a32132; background: #fde7eb; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; }
        button { padding: 10px 12px; border: 0; border-radius: 6px; cursor: pointer; font: inherit; font-size: 14px; }
        .description-button { background: #eaf1fb; color: #1754a4; }
        .buy-button { background: #1765cc; color: white; }
        button:disabled { background: #e0e4ea; color: #626c79; cursor: not-allowed; }
        button:focus-visible { outline: 3px solid #8db9f3; outline-offset: 2px; }
        .description { padding-top: 14px; border-top: 1px solid #e3e8ee; line-height: 1.6; overflow-wrap: anywhere; }
        .purchase-message { color: #14643a; font-size: 14px; line-height: 1.5; }
        .purchase-message:empty { display: none; }
        @media (max-width: 950px) { .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 500px) { .product-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main id="app" class="container" v-cloak>
        <header>
            <h1>Bài 2: Danh mục sản phẩm</h1>
            <p>Có {{ sanPham.length }} sản phẩm. Bấm “Xem mô tả” trên từng thẻ để xem thông tin sản phẩm.</p>
        </header>

        <!-- Cha truyền dữ liệu xuống con bằng v-bind (viết tắt là dấu :). -->
        <section class="product-grid" aria-label="Danh mục sản phẩm">
            <the-san-pham
                v-for="sp in sanPham"
                :key="sp.id"
                :ten="sp.ten"
                :gia="sp.gia"
                :anh="sp.anh"
                :mo-ta="sp.moTa"
                :so-luong-ton="sp.soLuongTon"
            ></the-san-pham>
        </section>
    </main>

    <!-- Nạp Vue và component trước khi đăng ký, mount ứng dụng. -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./components/TheSanPham.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {
                    sanPham: [
                        {
                            id: 1,
                            ten: 'Bút bi',
                            gia: 5000,
                            anh: './images/but-bi.svg',
                            moTa: 'Bút bi mực xanh, nét viết đều và êm. Phù hợp để ghi chép trong học tập và công việc.',
                            soLuongTon: 30
                        },
                        {
                            id: 2,
                            ten: 'Vở ô ly',
                            gia: 12000,
                            anh: './images/vo-o-ly.svg',
                            moTa: 'Vở ô ly 96 trang, giấy trắng với đường kẻ rõ ràng, thuận tiện cho việc luyện chữ và ghi bài.',
                            soLuongTon: 20
                        },
                        {
                            id: 3,
                            ten: 'Chuột không dây',
                            gia: 150000,
                            anh: './images/chuot.svg',
                            moTa: 'Chuột không dây nhỏ gọn, kết nối bằng đầu thu USB. Thiết kế vừa tay, phù hợp sử dụng cùng máy tính xách tay.',
                            soLuongTon: 8
                        },
                        {
                            id: 4,
                            ten: 'Bàn phím',
                            gia: 250000,
                            anh: './images/ban-phim.svg',
                            moTa: 'Bàn phím có dây với bố cục đầy đủ, phím bấm nhẹ và kết nối USB dễ sử dụng.',
                            soLuongTon: 0
                        }
                    ]
                };
            }
        });

        app.component('the-san-pham', TheSanPham);
        app.mount('#app');
    </script>
</body>
</html>
